<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Pixel canvas">
    <meta property="og:description" content="A shared canvas anyone can paint on.">
    <!-- alpha=0 on purpose: link previews must stay opaque, see the route in index.ts -->
    <meta property="og:image" content="http://localhost:8000/board.png?alpha=0">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
      /* Checkerboard for unpainted cells, which render() leaves transparent.
         Two 45deg gradients offset by half a tile is the standard trick: each paints
         one diagonal stripe pattern, the 8px offset fills the other's gaps.
         Lives on #stage, BEHIND the canvas - so it does not scale with the board and
         is not recomputed on every render. 16px is fixed on purpose: the checker is a
         visual convention, not data, so it should read the same at any board size. */
      #stage {
        background-color: #f7f7f7;
        background-image:
          linear-gradient(45deg, #e2e2e2 25%, transparent 25%,
                                 transparent 75%, #e2e2e2 75%),
          linear-gradient(45deg, #e2e2e2 25%, transparent 25%,
                                 transparent 75%, #e2e2e2 75%);
        background-size: 16px 16px;
        background-position: 0 0, 8px 8px;
      }
    </style>
    <title>Pixel canvas</title>
  </head>
  <body>
    <main class="container">
      <h1>Pixel Canvas</h1>
      <p><a href="/lobby.html">All canvases</a></p>
      <p id="status">Connecting...</p>
      <div id="stage" style="position:relative;width:768px;max-width:100%;
       border:1px solid #ccc">
<!--        display things that should not live on the board, grid lines, draft, hover, tap -->
        <canvas id="canvas" style="width:100%;display:block;
            image-rendering:pixelated;touch-action:none"></canvas>
        <canvas id="overlay" style="position:absolute;inset:0;
            width:100%;height:100%;pointer-events:none"></canvas>
      </div>
      <div id="palette"></div>
      <!-- main.ts appends the canvas id; alpha is left at its transparent default -->
      <a id="download" href="/board.png?scale=8" download="canvas.png"
         role="button">Download PNG</a>
      <a id="download-grid" href="/board.png?scale=8&amp;grid=1" download="canvas-grid.png"
         role="button" class="secondary">With grid</a>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
