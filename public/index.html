<!DOCTYPE html>
<html>
<script type="module" src="/main.js"></script>
  <head>
    <meta charset="utf-8">
    <meta property="og:title" content="Pixel canvas">
    <meta property="og:description" content="A shared canvas anyone can paint on.">
    <meta property="og:image" content="http://localhost:8000/board.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <title></title>
  </head>
  <body>
    <main class="container">
      <h1>Pixel Canvas</h1>
      <p><a href="/lobby.html">All canvases</a></p>
      <p id="status">Connecting...</p>
      <div id="stage" style="position:relative;width:768px;max-width:100%;
       border:1px solid #ccc">
<!--        display things that should not live on the board, grid lines, draft, hover, tap -->
        <canvas id="canvas" style="width:100%;display:block;
            image-rendering:pixelated;touch-action:none"></canvas>
        <canvas id="overlay" style="position:absolute;inset:0;
            width:100%;height:100%;pointer-events:none"></canvas>
      </div>
      <div id="palette"></div>
      <a href="/board.png?scale=8&amp;alpha=1" download="canvas.png"
         role="button">Download PNG</a>
      <a href="/board.png?scale=8&amp;alpha=1&amp;grid=1" download="canvas-grid.png"
         role="button" class="secondary">With grid</a>
    </main>
  </body>
</html>
