<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Placeholders, filled per canvas by pageFor() in index.ts. Crawlers do not run
         JavaScript, so choosing the canvas client-side would give every shared link
         main's preview. -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{URL}}">
    <!-- alpha=0 on purpose: link previews must stay opaque, see the route in index.ts -->
    <meta property="og:image" content="{{IMAGE}}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
      /* Checkerboard for unpainted cells, which render() leaves transparent.
         Lives on #stage, BEHIND the canvas - so it does not scale with the board and
         is not recomputed on every render. 16px is fixed on purpose: the checker is a
         visual convention, not data, so it should read the same at any board size.

         One conic gradient per 16px tile = four exact 8px quadrants, alternating.
         The usual two-45deg-gradient recipe builds each check out of corner triangles
         and leans on a half-tile offset to interlock them, which leaves a bare triangle
         at the origin where nothing overlaps it yet.

         The tones are blue-grey, not neutral grey, and that is the whole point. Every
         neutral in PALETTE is a pure grey - white 255, light grey 228, grey 136, black 34 -
         so a neutral checkerboard collides with one of them on lightness alone. #d2d2d2
         checks against index 1's #e4e4e4 was 18 levels apart and read as the same thing.
         A blue cast cannot be confused with any of them at any brightness, and the
         lightness also sits in the wide gap between index 1 and index 2.
         Matters more than it looks: a board cell is ~3px on screen while a check is 8px,
         so one painted pixel sits inside a single check with nothing to contrast against. */
      #stage {
        background-color: #b6c3d0;  /* flat fallback if conic-gradient is unsupported */
        background-image: repeating-conic-gradient(#a3b3c4 0% 25%, #c2ceda 0% 50%);
        background-size: 16px 16px;
      }

      /* Title left, page tabs dead centre, sign-in status right. A grid rather than
         flex space-between, so the tabs stay centred whatever the sides' widths. */
      .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
                gap: 1rem; margin-bottom: 1.5rem; }
      .topbar h1 { margin: 0; font-size: 1.6rem; }
      /* The current page's tab is underlined, so it is clear which page you are on. */
      .tabs { display: flex; border-bottom: 1px solid var(--pico-muted-border-color); }
      .tabs a { padding: .6rem 1.2rem; margin-bottom: -1px; text-decoration: none; font-weight: 500;
                color: var(--pico-muted-color); border-bottom: 3px solid transparent; }
      .tabs a:hover { color: var(--pico-color); }
      .tabs a[aria-current="page"] { color: var(--pico-primary); border-bottom-color: var(--pico-primary); }
      .topbar > :last-child { justify-self: end; }
      @media (max-width: 600px) {
        .topbar { grid-template-columns: 1fr; justify-items: center; }
        .topbar > :last-child { justify-self: center; }
        /* A full-width bar with equal halves: bigger tap targets, reads as a phone tab bar. */
        .tabs { justify-self: stretch; }
        .tabs a { flex: 1; text-align: center; }
      }
    </style>
    <title>{{TITLE}}</title>
  </head>
  <!-- Read by main.ts for display only; the server does the real ownership check -->
  <body data-name="{{NAME}}" data-owner-id="{{OWNER_ID}}">
    <main class="container">
      <header class="topbar">
        <h1>Pixel Canvas</h1>
        <!-- main.ts marks the Main tab current when this page is showing main -->
        <nav class="tabs">
          <a id="maintab" href="/c/main">Main canvas</a>
          <a id="lobbylink" href="/lobby.html">All canvases</a>
        </nav>
        <div id="auth"></div>
      </header>
      <p id="status">Connecting...</p>
      <!-- dev readout, shown when the URL has ?metrics -->
      <p><small id="metrics" hidden style="font-family:ui-monospace,Menlo,monospace"></small></p>
      <!-- Canvas and, for the owner, the inactivity warning beside it. Wraps below on phones. -->
      <div style="display:flex;gap:1.25rem;align-items:flex-start;flex-wrap:wrap">
      <!-- A column so the GitHub link can sit under the canvas's right edge, wherever the
           expiry panel wraps to. -->
      <div style="width:768px;max-width:100%">
      <div id="stage" style="position:relative;width:100%;
       border:1px solid #ccc">
<!--        display things that should not live on the board, grid lines, draft, hover, tap -->
        <canvas id="canvas" style="width:100%;display:block;
            image-rendering:pixelated;touch-action:none"></canvas>
        <canvas id="overlay" style="position:absolute;inset:0;
            width:100%;height:100%;pointer-events:none"></canvas>
      </div>
      <!-- Shown on main only, by main.ts. Below the canvas rather than on it, where it
           would cover pixels and catch strokes. -->
      <div id="github-row" hidden style="text-align:right;margin-top:.5rem">
        <a href="https://github.com/calvinKLyeung/pixel-canvas" target="_blank" rel="noopener"
           role="button" class="secondary outline" title="Source code on GitHub"
           aria-label="Source code on GitHub" style="padding:.45rem;margin:0;line-height:0">
          <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </div>
      </div>
      <aside id="expiry" hidden style="flex:1 1 200px;max-width:280px;margin:0">
        <article style="margin:0;padding:1rem">
          <p style="margin:0 0 .25rem"><strong id="expiry-days"></strong></p>
          <p style="margin:0 0 .75rem"><small>Your room and account are deleted after
            30 days with no activity. Log in or paint in your room to reset the count.</small></p>
          <button id="expiry-renew" class="secondary" style="width:100%;margin:0">Log in again to renew</button>
        </article>
      </aside>
      </div>
      <div id="palette"></div>
      <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:1rem 0">
        <label><input type="checkbox" id="eraser"> Eraser</label>
        <select id="brush" aria-label="Brush size" style="width:auto;margin:0"></select>
      </div>
      <p><small id="notice"></small></p>
      <!-- main.ts appends the canvas id; alpha is left at its transparent default -->
      <a id="download" href="/board.png?scale=8" download="canvas.png"
         role="button">Download PNG</a>
      <a id="download-grid" href="/board.png?scale=8&amp;grid=1" download="canvas-grid.png"
         role="button" class="secondary">With grid</a>
      <button id="clearall" class="contrast outline" hidden>Clear canvas for everyone</button>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
